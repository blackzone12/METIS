<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METIS AI - Adaptive Runtime & Telemetry Console</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; }
        code, pre { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col custom-scrollbar">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-50 glass">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-white shadow-lg shadow-indigo-500/30">
                    <i data-lucide="cpu" class="w-6 h-6"></i>
                </div>
                <div>
                    <span class="font-bold text-lg tracking-wider text-white">METIS</span>
                    <span class="text-xs bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 px-2 py-0.5 rounded-full ml-2">v2.4-Orchestrator</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-6 text-sm">
                <div class="flex items-center space-x-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-slate-400 font-medium">Backend: <span class="text-emerald-400">Connected</span></span>
                </div>
                <div class="h-4 w-px bg-slate-800"></div>
                <div class="flex items-center space-x-2 text-slate-400">
                    <i data-lucide="database" class="w-4 h-4 text-slate-500"></i>
                    <span>SQLite Cache: <span class="text-slate-200 font-mono">metis.db</span></span>
                </div>
                <button onclick="toggleConfigModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center space-x-2 transition">
                    <i data-lucide="settings" class="w-3.5 h-3.5"></i>
                    <span>API Config</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Body Container -->
    <div class="flex-1 flex max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 gap-6">

        <!-- Navigation Sidebar -->
        <aside class="w-64 flex-shrink-0 space-y-2">
            <nav class="space-y-1">
                <button onclick="switchTab('runtime')" id="btn-runtime" class="tab-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-indigo-600 text-white shadow-md transition">
                    <i data-lucide="terminal" class="w-4 h-4"></i>
                    <span>AI Runtime & Chat</span>
                </button>
                <button onclick="switchTab('remediation')" id="btn-remediation" class="tab-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-900 hover:text-slate-200 transition">
                    <i data-lucide="shield-alert" class="w-4 h-4"></i>
                    <span>Guardrails & Remediation</span>
                </button>
                <button onclick="switchTab('scratchpad')" id="btn-scratchpad" class="tab-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-900 hover:text-slate-200 transition">
                    <i data-lucide="edit-3" class="w-4 h-4"></i>
                    <span>Scratchpad & Notes</span>
                </button>
                <button onclick="switchTab('voice')" id="btn-voice" class="tab-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-900 hover:text-slate-200 transition">
                    <i data-lucide="mic" class="w-4 h-4"></i>
                    <span>Voice & Speech Synthesis</span>
                </button>
                <button onclick="switchTab('telemetry')" id="btn-telemetry" class="tab-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-900 hover:text-slate-200 transition">
                    <i data-lucide="activity" class="w-4 h-4"></i>
                    <span>Telemetry & Metrics</span>
                </button>
            </nav>

            <div class="pt-6">
                <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 text-xs space-y-3">
                    <div class="font-semibold text-slate-300 flex items-center justify-between">
                        <span>KV Cache Status</span>
                        <span class="text-indigo-400 font-mono">84% Hit</span>
                    </div>
                    <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                        <div class="bg-indigo-500 h-full rounded-full" style="width: 84%"></div>
                    </div>
                    <div class="flex justify-between text-slate-500">
                        <span>Active Keys: 1,420</span>
                        <span>Rate Limit: Normal</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Workspace View Container -->
        <main class="flex-1 bg-slate-900/50 border border-slate-800 rounded-2xl flex flex-col overflow-hidden">
